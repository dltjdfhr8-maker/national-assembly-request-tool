[build]
  command = "python build_site.py"
  publish = "web"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/recommend"
  to = "/.netlify/functions/recommend"
  status = 200

# Netlify의 업무 화면 주소도 Vercel의 같은 서버·cases.json을 사용한다.
# 302는 화면 이동용이며, API 요청은 Netlify에서 대리 처리하지 않는다.
[[redirects]]
  from = "/"
  to = "https://national-assembly-request-tool-six.vercel.app/web/"
  status = 302
  force = true

[[redirects]]
  from = "/web/*"
  to = "https://national-assembly-request-tool-six.vercel.app/web/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/*"
  to = "https://national-assembly-request-tool-six.vercel.app/web/:splat"
  status = 302
  force = true
