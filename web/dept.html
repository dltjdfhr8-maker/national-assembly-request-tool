<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>국회 요구자료 · 현업 회신</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar"><div class="top-inner">
    <a class="brand" href="./index.html"><span class="brand-mark">A</span><span>국회 요구자료 관리</span></a>
    <nav class="nav" aria-label="화면 이동">
      <a href="./index.html">시작 화면</a>
      <a href="./assign.html">배분</a>
      <a class="active" aria-current="page" href="./dept.html">현업 회신</a>
      <a href="./collect.html">취합</a>
    </nav>
  </div></header>
  <main class="shell">
    <div class="hero"><div><span class="eyebrow">A부 · 현업 담당</span><h1>내 과 회신</h1><p>배분된 문항을 확인하고 회신 엑셀 또는 재배정 요청을 제출합니다.</p></div><div class="hero-actions"><span class="hero-tag" id="storage-mode">저장 위치 확인 중</span></div></div>
    <section class="section" aria-labelledby="my-dept-title">
      <div class="section-head"><div><h2 id="my-dept-title">내 과 선택</h2><p>선택한 과에 배분된 문항만 아래에 표시합니다.</p></div><span class="count-note" id="dept-count">0문항</span></div>
      <div class="section-body">
        <div class="input-grid dept-select-grid">
          <label class="field">내 과<select id="my-dept"><option value="">과를 선택해 주세요</option></select></label>
          <label class="field">담당자 표시<input id="actor" type="text" placeholder="처리 이력에 남길 담당 표시" autocomplete="off"></label>
          <div class="actions"><button class="button" id="refresh" type="button">기록 새로고침</button></div>
        </div>
        <div id="dept-message" class="message" role="status" aria-live="polite"></div>
      </div>
    </section>
    <section class="section" aria-labelledby="cases-title">
      <div class="section-head"><div><h2 id="cases-title">배분된 문항</h2><p>회신 엑셀은 1행 요구 표시, 2행 머리글, 3행부터 자료 행을 읽습니다.</p></div><span class="count-note" id="data-status">자료 읽는 중…</span></div>
      <div class="section-body dept-cards" id="dept-cards"><div class="empty">과를 선택해 주세요.</div></div>
    </section>
    <p class="foot">실제 요구자료는 내부 시스템에서만 처리하세요. 이 화면의 과 선택은 사용자 인증을 대신하지 않습니다.</p>
  </main>
  <script src="./lib/papaparse.min.js"></script><script src="./lib/xlsx.full.min.js"></script>
  <script src="./engine.js"></script><script src="./flow.js"></script><script src="./validate.js"></script><script src="./common.js"></script>
  <script type="module" src="./dept.js"></script>
</body>
</html>
